name: Validate PaperSmith
on: [push, pull_request]
jobs:
  definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: ./scripts/validate-definition.sh papersmith
      - run: python3 scripts/check-pi-only-backend.py
      - run: docker build --build-arg AGENT_NAME=papersmith -t papersmith:test -f docker/Dockerfile .
      - run: >-
          docker run --rm --entrypoint bash papersmith:test -c
          'command -v pi &&
          test -f /opt/install/lib/papersmith/agent-definition/package.json &&
          command -v papersmith-cli && command -v papersmith-tool &&
          papersmith-tool --check &&
          papersmith --help && papersmith --version &&
          papersmith doctor >/dev/null &&
          test -z "$(find /opt/install -name AGENTS.md -print -quit)"'
