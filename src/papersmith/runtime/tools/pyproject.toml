[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersmith-runtime-tools"
version = "0.1.0"
description = "Minimal deterministic tools for the PaperSmith runtime smoke"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
papersmith-tool = "papersmith_tool:main"

[tool.setuptools]
py-modules = ["papersmith_tool"]
