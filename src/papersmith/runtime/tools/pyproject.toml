[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersmith-tools"
version = "0.1.0"
description = "Deterministic control tools for the PaperSmith Agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
papersmith-cli = "papersmith.cli:main"
papersmith-tool = "papersmith_tool:main"

[tool.setuptools]
py-modules = ["papersmith_tool"]

[tool.setuptools.packages.find]
include = ["papersmith*"]

[tool.setuptools.package-data]
papersmith = ["templates/*"]
